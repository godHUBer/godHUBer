<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Initial D — The Akina Gutter Run</title>
<desc id="desc">An original vector recreation of Takumi’s white and black AE86 taking the inside gutter on Mount Akina at night.</desc>
<defs>
  <clipPath id="frame"><rect width="1100" height="420" rx="18"/></clipPath>
  <linearGradient id="sky" x2="0%" y2="100%"><stop stop-color="#09091c"/><stop offset="1" stop-color="#50406a"/></linearGradient>
  <linearGradient id="road" x2="0%" y2="100%"><stop stop-color="#434256"/><stop offset="1" stop-color="#171821"/></linearGradient>
  <linearGradient id="paint" x2="0%" y2="100%"><stop stop-color="#fff8e4"/><stop offset="1" stop-color="#b6adbb"/></linearGradient>
  <linearGradient id="beam"><stop stop-color="#fff1ad" stop-opacity=".78"/><stop offset="1" stop-color="#ffdc9c" stop-opacity="0"/></linearGradient>
  <linearGradient id="shade"><stop stop-color="#0a0a1b"/><stop offset="1" stop-color="#0a0a1b" stop-opacity="0"/></linearGradient>
  <pattern id="grate" width="32" height="22" patternUnits="userSpaceOnUse"><path d="M8 3v16m6-16v16m6-16v16" stroke="#171723" stroke-width="3"/></pattern>
  <path id="pine" d="M0 0l11 24H5l13 19H9l15 19H3v14h-6V62h-21l15-19h-9l13-19h-6z"/>
  <linearGradient id="glass" x2="0%" y2="100%"><stop stop-color="#796e8e"/><stop offset=".54" stop-color="#393346"/><stop offset="1" stop-color="#1c1928"/></linearGradient>
  <linearGradient id="rubber" x2="0%" y2="100%"><stop stop-color="#2b2936"/><stop offset="1" stop-color="#101018"/></linearGradient>
  <linearGradient id="light" x2="0%" y2="100%"><stop stop-color="#fffef6"/><stop offset="1" stop-color="#efd594"/></linearGradient>
  <g id="wheel">
    <circle r="55" fill="url(#rubber)" stroke="#13131c" stroke-width="3"/>
    <circle r="50" fill="none" stroke="#45424f" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle r="40" fill="#191821" stroke="#85818c" stroke-width="3"/>
    <g class="spokes"><path d="M36.00 0.00q-16.86 2.20 -29.00 -0.00M25.46 25.46q-13.48 -10.36 -20.51 -20.51M0.00 36.00q-2.20 -16.86 -0.00 -29.00M-25.46 25.46q10.36 -13.48 20.51 -20.51M-36.00 0.00q16.86 -2.20 29.00 -0.00M-25.46 -25.46q13.48 10.36 20.51 20.51M-0.00 -36.00q2.20 16.86 0.00 29.00M25.46 -25.46q-10.36 13.48 -20.51 20.51" fill="none" stroke="#9693a0" stroke-width="4.5" stroke-linecap="round"/><circle r="8" fill="#3d3a49" stroke="#bab3bb" stroke-width="2"/></g>
  </g>
</defs>
<style>
  .spokes { transform-origin:0 0 }
  .sparks { opacity:0 }
  @keyframes corner { 0%,100% {transform:translate(-26px,-15px) rotate(-2.6deg)} 25% {transform:translate(9px,0) rotate(1deg)} 44%,63% {transform:translate(20px,1px) rotate(1.6deg)} 81% {transform:translate(10px,1px) rotate(0deg)} }
  @keyframes spin {to {transform:rotate(360deg)}}
  @keyframes track {to {stroke-dashoffset:160}}
  @keyframes skid {0%,25%,80%,100% {opacity:0} 42%,59% {opacity:.9}}
  @media (prefers-reduced-motion:no-preference) {
    .car {transform-origin:741px 350px;animation:corner 4s ease-in-out infinite}
    .spokes {animation:spin .48s linear infinite}
    .speed {animation:track .75s linear infinite}
    .sparks {animation:skid 4s ease-in-out infinite}
  }
</style>
<g clip-path="url(#frame)">
  <path d="M0 0h1100v420H0z" fill="url(#sky)"/>
  <circle cx="891" cy="87" r="51" fill="#ccb9dc" opacity=".09"/>
  <circle cx="891" cy="87" r="31" fill="#f9e0bb"/>
  <path d="M0 206 155 115l110 38 109-77 74 56 116-40 74 49 117-65 144 90 89-81 112 86v249H0z" fill="#413552"/>
  <path d="M0 240 122 174l75 26 144-61 150 70 130-56 79 43 110-63 105 52 111-47 74 41v241H0z" fill="#28243d"/>
  <g fill="#171727">
    <use href="#pine" transform="translate(511 142) scale(.93)"/><use href="#pine" transform="translate(560 125) scale(1.2)"/><use href="#pine" transform="translate(613 156) scale(.8)"/><use href="#pine" transform="translate(667 135) scale(1.17)"/><use href="#pine" transform="translate(734 162) scale(.8)"/><use href="#pine" transform="translate(791 130) scale(1.2)"/><use href="#pine" transform="translate(853 159) scale(.9)"/><use href="#pine" transform="translate(915 122) scale(1.44)"/><use href="#pine" transform="translate(981 139) scale(1.15)"/><use href="#pine" transform="translate(1044 115) scale(1.55)"/><use href="#pine" transform="translate(1092 160)"/>
  </g>
  <path d="M0 269Q530 202 1100 227v193H0z" fill="url(#road)"/>
  <path d="M387 241Q757 189 1100 210m-713 39q370-52 713-31" fill="none" stroke="#aaa1ae" stroke-width="3"/>
  <path d="M488 232v19m115-34v20m118-30v22m125-27v22m117-23v23m118-19v23" stroke="#aaa1ae" stroke-width="4"/>
  <path class="speed" d="M318 306Q683 228 1100 249" fill="none" stroke="#ddb976" stroke-width="3" stroke-dasharray="55 105"/>
  <path d="M253 420Q707 308 1100 326v94z" fill="#28232e"/>
  <path d="M255 415Q730 302 1100 321l0 23Q720 325 344 420z" fill="#69616c"/>
  <path d="M255 415Q730 302 1100 321l0 23Q720 325 344 420z" fill="url(#grate)"/>
  <path d="M255 415Q730 302 1100 321" fill="none" stroke="#c3adab" stroke-width="3"/>
  <path class="speed" d="M453 351q240-49 400-55m-325 78q289-49 572-19" fill="none" stroke="#cdbcc8" stroke-opacity=".32" stroke-dasharray="34 126" stroke-width="2"/>
  <g class="car">
    <!-- Hand-drawn projection, using the proportions in https://initiald.fan/cars/ae86-trueno/ as reference. No photo is embedded. -->
    <g transform="translate(476 26) scale(.53 .49)">
      <path d="M103 497Q329 452 890 506L996 562Q865 663 482 671 205 620 95 546Z" fill="#11111b" opacity=".71"/>
      <path d="M683 474 1160 446 1230 676 685 506Z" fill="url(#beam)" opacity=".35"/>
      <path d="M935 460 1195 388 1230 563 939 490Z" fill="url(#beam)" opacity=".6"/>
      <!-- Three-quarter silhouette: short rear overhang, long hatch, and a low angular nose. -->
      <path d="M90 395 99 347 115 322 240 250Q266 234 334 233L580 234Q619 235 641 248L751 356 927 418 957 423 976 480 983 528 962 568 907 591 581 630 500 615 423 573 194 501 102 467 85 437Z" fill="url(#paint)" stroke="#171622" stroke-width="4"/>
      <path d="M90 398 129 406Q145 385 173 401L192 425 443 488Q470 446 509 471L532 505 648 529 975 481 983 528 962 568 907 591 581 630 500 615 423 573 194 501 102 467 85 437Z" fill="#22212c"/>
      <path d="M87 418 129 431m66 18 244 65m101 21 122 26 312-52" fill="none" stroke="#d7cbd0" stroke-width="10"/>
      <!-- Each window is a separate plane, with pillars left in the body color. -->
      <path d="M132 318 246 261 287 251 240 355 143 336Z M253 360 304 252 347 256 371 274 403 395Z M381 266 620 254 744 355 426 383Z" fill="url(#glass)" stroke="#252332" stroke-width="5" stroke-linejoin="round"/>
      <path d="M145 320 250 266l27-6-106 66zm127 20 34-78 38 1-56 68zm160 19 43-93 66-3-71 91zm99-5 66-93 21-1 22 17-57 70z" fill="#c4adc6" opacity=".22"/>
      <path d="M426 383 744 355 930 426 977 487 650 537 620 477Z" fill="#262432" stroke="#14131c" stroke-width="4"/>
      <path d="M440 384 744 359 910 423 701 450Z" fill="#464250" opacity=".57"/>
      <path d="M652 536 977 487m-306 54 303-48" stroke="#8a7d8a" stroke-width="2" fill="none"/>
      <path d="M405 398 439 525 426 570M254 365l-51 119" fill="none" stroke="#625a6a" stroke-width="2.4"/>
      <path d="m240 380 20 6-3 9-20-6zM335 357l55 10 9 16-58-6z" fill="#292634"/>
      <text x="258" y="409" transform="rotate(16 258 409)" font-family="sans-serif" font-size="23" font-weight="800" fill="#23212a">藤原とうふ店<tspan font-size="11"> (自家用)</tspan></text>
      <path d="m598 491 44 12 4 16-48-12z" fill="#b96a49" stroke="#25202a" stroke-width="3"/>
      <!-- The two raised lamps occupy different quadrilaterals in perspective. -->
      <path d="m645 503 4-48 15-13 48-8 12 14-5 51zM897 476l4-44 12-11 42-6 12 9-5 45z" fill="#13131d" stroke="#706977" stroke-width="3"/>
      <path d="m658 463 50-9-3 38-51 9zM908 438l47-7-3 32-47 8z" fill="url(#light)" stroke="#a79a8e" stroke-width="2"/>
      <path d="m660 471 46-8m-48 17 47-8m206-26 41-7m-42 15 41-7" stroke="#fff9dd" opacity=".7" stroke-width="2"/>
      <path d="M656 554 977 503l-4 26-314 51z" fill="#16151d"/>
      <text x="807" y="550" transform="rotate(-9 807 550)" font-family="sans-serif" font-size="14" font-weight="900" fill="#fff2dc">TRUENO</text>
      <path d="m714 550 19-3v15l-19 4zm210-35 18-3-1 15-18 3zM673 594l44-8-1 21-44 7zm241-39 37-8-2 20-37 6z" fill="#ffbd69" stroke="#775044" stroke-width="3"/>
      <path d="m786 565 72-11-4 40-72 11z" fill="#d8cdbd"/><text x="797" y="589" fill="#24222b" font-family="monospace" font-size="20" transform="rotate(-9 797 589)">AE 86</text>
      <path d="M128 443q-1-56 34-50t48 74l-4 30-76-17zm305 69q12-59 48-50 43 6 61 69l2 42-111-22z" fill="#181720"/>
      <!-- Tire projection: (x,y) ↦ (a*x+c*y+e, b*x+d*y+f). Distinct sheared ellipses keep the near front wheel larger. -->
      <use href="#wheel" transform="matrix(.76 -.11 .18 1.36 164 484)"/>
      <use href="#wheel" transform="matrix(1.16 -.19 .24 1.49 500 578)"/>
    </g>
    <g class="sparks" fill="none" stroke="#ffbc81" stroke-linecap="round"><path d="m741 349-29 4m25-1-40 9m28-4-22 11" stroke-width="2"/><path d="m718 362-20 6m42-16-41 2" opacity=".55"/></g>
  </g>
  <path d="M0 0h625v420H0z" fill="url(#shade)"/>
  <path d="M0 0h1100v12H0zm0 374h1100v46H0z" fill="#0b0a17"/>
  <path d="M0 374h1100" stroke="#b397af" stroke-opacity=".45"/>
  <g font-family="ui-monospace, Consolas, monospace">
    <text x="53" y="77" fill="#ff9b86" font-size="16" letter-spacing="3">INITIAL D / MT. AKINA</text>
    <text x="49" y="153" fill="#fff4e6" font-family="system-ui,sans-serif" font-weight="900" font-style="italic" font-size="72" letter-spacing="-3">GUTTER</text>
    <text x="49" y="219" fill="#ffc0a6" font-family="system-ui,sans-serif" font-weight="900" font-style="italic" font-size="72" letter-spacing="-3">RUN</text>
    <path d="M54 252h52" stroke="#ff9b86" stroke-width="3"/>
    <text x="53" y="286" fill="#ded4e4" font-size="18" letter-spacing="1">TAKUMI FUJIWARA / AE86</text>
    <text x="53" y="403" fill="#ded4e4" font-size="15" letter-spacing="1.5">FUSHIWARA_CODES / @godHUBer</text>
    <text x="1047" y="403" text-anchor="end" fill="#ffbda7" font-size="15" letter-spacing="1.5">FAN ANIMATION</text>
  </g>
</g>
<rect x=".5" y=".5" width="1099" height="419" rx="17.5" fill="none" stroke="#b397af" stroke-opacity=".35"/>
</svg>
