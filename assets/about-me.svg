  </defs>
  <style>
    @keyframes shimmer { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes drive { to { stroke-dashoffset:-100 } }
    @keyframes meteor { 0%,72%,100% { opacity:0; transform:translate(80px,-44px) } 76% { opacity:.9 } 84% { opacity:0; transform:translate(-155px,87px) } }
    .meteor {opacity:0}
    @media (prefers-reduced-motion: no-preference) {
      .twinkle { animation:shimmer 4.8s ease-in-out infinite }
      .twinkle.late { animation-delay:-2.4s }
      .tail { animation:drive 8s linear infinite }
      .meteor { animation:meteor 13s linear infinite }
    }
  </style>
