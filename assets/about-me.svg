    <text x="53" y="77" fill="#ff9b86" font-size="16" letter-spacing="3">INITIAL D / MT. AKINA</text>
    <text x="49" y="153" fill="#fff4e6" font-family="system-ui,sans-serif" font-weight="900" font-style="italic" font-size="72" letter-spacing="-3">GUTTER</text>
    <text x="49" y="219" fill="#ffc0a6" font-family="system-ui,sans-serif" font-weight="900" font-style="italic" font-size="72" letter-spacing="-3">RUN</text>
