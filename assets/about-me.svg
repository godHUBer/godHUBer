<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Fushiwara_codes — Night Drive Observatory</title>
  <desc id="desc">A winding mountain road leads toward a glowing star above the ridgeline.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#101b33"/><stop offset="1" stop-color="#343056"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cedbf0" opacity=".07"/></pattern>
    <radialGradient id="halo"><stop stop-color="#ffab82" stop-opacity=".8"/><stop offset="1" stop-color="#ffab82" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="900" height="320" rx="16"/></clipPath>
  </defs>
  <style>@keyframes travel { to { stroke-dashoffset: -120; } } @media (prefers-reduced-motion: no-preference) { .lights { animation: travel 6s linear infinite; } }</style>
  <g clip-path="url(#frame)">
    <rect width="900" height="320" fill="url(#sky)"/><rect width="900" height="320" fill="url(#grid)"/>
    <g fill="#d9e6ef"><circle cx="534" cy="74" r="2"/><circle cx="601" cy="56" r="1.4"/><circle cx="651" cy="114" r="2"/><circle cx="820" cy="39" r="2"/><circle cx="864" cy="84" r="1.4"/></g>
    <circle cx="729" cy="78" r="46" fill="url(#halo)"/><path d="m729 65 2 10 10 3-10 2-2 11-2-11-11-2 11-3z" fill="#ffe0b6"/>
    <path d="m415 265 98-70 37 13 100-86 54 41 74-58 122 89v126H415z" fill="#424662"/>
    <path d="m380 279 152-67 48 10 93-57 52 16 101-47 74 27v159H380z" fill="#262f48"/>
    <path d="M0 265q300 15 490-21t410-61v137H0z" fill="#152338"/>
    <path id="road" d="M547 292c15-44 235-54 165-76s-9-28 54-41" fill="none" stroke="#53627a" stroke-width="12"/>
    <path class="lights" d="M547 292c15-44 235-54 165-76s-9-28 54-41" fill="none" stroke="#ffbe94" stroke-width="2" stroke-dasharray="8 12"/>
    <g font-family="monospace"><text x="38" y="46" fill="#ffc09e" font-size="14" letter-spacing="3">NIGHT DRIVE OBSERVATORY</text><text x="35" y="151" fill="#f7f3eb" font-size="48" font-weight="bold">Fushiwara_codes</text><text x="39" y="189" fill="#c0dbe2" font-size="20">Programmer / amateur stargazer</text>
    <rect y="278" width="900" height="42" fill="#101a2b"/><text x="38" y="305" fill="#addbd7" font-size="14" letter-spacing="2">FIELD LOG / @godHUBer</text><text x="861" y="305" text-anchor="end" fill="#ffc09e" font-size="14">AFTER HOURS ↗</text></g>
  </g>
