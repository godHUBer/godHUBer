<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Initial D — The Akina Gutter Run</title>
<desc id="desc">An original vector recreation of Takumi’s white and black AE86 taking the inside gutter on Mount Akina at night.</desc>
<defs>
  <clipPath id="frame"><rect width="1100" height="420" rx="18"/></clipPath>
  <linearGradient id="sky" x2="0%" y2="100%"><stop stop-color="#09091c"/><stop offset="1" stop-color="#50406a"/></linearGradient>
  <linearGradient id="road" x2="0%" y2="100%"><stop stop-color="#434256"/><stop offset="1" stop-color="#171821"/></linearGradient>
  <linearGradient id="paint" x2="0%" y2="100%"><stop stop-color="#fff8e4"/><stop offset="1" stop-color="#b6adbb"/></linearGradient>
  <linearGradient id="beam"><stop stop-color="#fff1ad" stop-opacity=".78"/><stop offset="1" stop-color="#ffdc9c" stop-opacity="0"/></linearGradient>
  <linearGradient id="shade"><stop stop-color="#0a0a1b"/><stop offset="1" stop-color="#0a0a1b" stop-opacity="0"/></linearGradient>
  <pattern id="grate" width="32" height="22" patternUnits="userSpaceOnUse"><path d="M8 3v16m6-16v16m6-16v16" stroke="#171723" stroke-width="3"/></pattern>
  <path id="pine" d="M0 0l11 24H5l13 19H9l15 19H3v14h-6V62h-21l15-19h-9l13-19h-6z"/>
  <g id="wheel">
    <circle r="31" fill="#11111b" stroke="#666170" stroke-width="2"/>
    <circle r="21" fill="#292937" stroke="#d1c6ca" stroke-width="3"/>
    <g class="spokes"><path d="M-17 0h34M0-17v34M-12-12l24 24m0-24-24 24" stroke="#d1c6ca" stroke-width="4"/><circle r="6" fill="#474351" stroke="#e2d6d4"/></g>
  </g>
</defs>
<style>
  .spokes { transform-origin:0 0 }
  .sparks { opacity:0 }
  @keyframes corner { 0%,100% {transform:translate(-34px,-12px) rotate(-3deg)} 25% {transform:translate(9px,0) rotate(1deg)} 44%,63% {transform:translate(26px,9px) rotate(3deg)} 81% {transform:translate(10px,1px) rotate(0deg)} }
  @keyframes spin {to {transform:rotate(360deg)}}
  @keyframes track {to {stroke-dashoffset:160}}
  @keyframes skid {0%,25%,80%,100% {opacity:0} 42%,59% {opacity:.9}}
  @media (prefers-reduced-motion:no-preference) {
    .car {transform-origin:746px 278px;animation:corner 4s ease-in-out infinite}
    .spokes {animation:spin .48s linear infinite}
    .speed {animation:track .75s linear infinite}
    .sparks {animation:skid 4s ease-in-out infinite}
  }
</style>
