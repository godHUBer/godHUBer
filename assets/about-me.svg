    <linearGradient id="ridge" x2="0%" y2="100%"><stop stop-color="#505577"/><stop offset="1" stop-color="#20283c"/></linearGradient>
    <linearGradient id="shade"><stop stop-color="#090f21"/><stop offset=".73" stop-color="#090f21" stop-opacity=".7"/><stop offset="1" stop-color="#090f21" stop-opacity="0"/></linearGradient>
